<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>الكون اللانهائي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#02030a;color:#e8f0ff;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:5}
#top{top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;justify-content:space-between;gap:6px}
.pill{background:rgba(8,14,34,.74);border:1px solid rgba(120,170,255,.35);border-radius:12px;padding:5px 9px;font-size:13px;white-space:nowrap}
#bars{top:50px;left:6px;width:130px;direction:ltr}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:5px;margin:3px 0;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:5px}
#b-hull i{background:#ff5a5a}#b-sh i{background:#4cc3ff}#b-fuel i{background:#ffd24c}
#radar{top:104px;right:6px;width:104px;height:104px;border-radius:50%;background:rgba(5,12,30,.6);border:1px solid rgba(120,170,255,.4)}
#warp{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#7aa8ff 30%,#0a1030 80%)}
#warp.on{animation:wp 1.1s ease-out}@keyframes wp{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#quest{top:50px;right:6px;max-width:48vw;font-size:12px;line-height:1.5;text-align:right}
#toast{top:34%;left:50%;transform:translateX(-50%);background:rgba(10,20,50,.9);border:1px solid #6aa8ff;padding:10px 16px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s;text-align:center;max-width:86vw}
#toast.on{opacity:1}
#ctx{bottom:max(150px,22vh);left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
.btn{pointer-events:auto;background:linear-gradient(#2b5cff,#1a3bb8);border:1px solid #8fb2ff;color:#fff;border-radius:14px;padding:10px 16px;font-size:16px;font-family:inherit;cursor:pointer}
.btn.g{background:linear-gradient(#18a05a,#0d6b3a);border-color:#7be0a8}
.btn.r{background:linear-gradient(#c93030,#8a1b1b);border-color:#ff9a9a}
.btn.d{background:rgba(20,28,60,.85);border-color:#6a7fb8}
.btn:active{filter:brightness(1.3)}
.btn[disabled]{opacity:.4}
#joy{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(120,160,255,.12);border:2px solid rgba(140,180,255,.4);z-index:6;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(160,200,255,.55)}
#acts{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.big{width:84px;height:84px;border-radius:50%;font-size:17px;padding:0;pointer-events:auto}
#menu{position:fixed;inset:0;z-index:20;background:rgba(2,4,14,.82);display:none;align-items:center;justify-content:center}
#menu.on{display:flex}
#panel{width:min(94vw,520px);max-height:90vh;overflow:auto;background:#0b1233;border:1px solid #5f86ff;border-radius:18px;padding:14px;touch-action:pan-y}
#panel h2{margin:0 0 8px;font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.row small{opacity:.7}
#mapc{width:100%;aspect-ratio:1;background:#02030a;border:1px solid #3a4f99;border-radius:12px;touch-action:none}
#build{position:fixed;bottom:0;left:0;right:0;z-index:6;display:none;gap:6px;padding:8px;overflow-x:auto;background:rgba(5,10,30,.85);border-top:1px solid #4b66c8;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#build .btn{flex:0 0 auto;font-size:13px;padding:8px 10px;text-align:center}
#title{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,#10205a,#02030a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#title h1{font-size:40px;margin:0;text-shadow:0 0 24px #4f8cff}
#title p{margin:0;opacity:.8;max-width:420px;line-height:1.7;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="top"><div class="pill" id="p-loc"></div><div class="pill" id="p-cr"></div></div>
<div class="hud" id="bars"><div class="bar" id="b-hull"><i></i></div><div class="bar" id="b-sh"><i></i></div><div class="bar" id="b-fuel"><i></i></div></div>
<div class="hud pill" id="quest"></div>
<canvas class="hud" id="radar" width="104" height="104"></canvas><div id="warp"></div><div class="hud" id="toast"></div>
<div class="hud" id="ctx"></div>
<div id="joy"><div id="knob"></div></div>
<div id="acts"><button class="btn d big" id="msl" style="width:64px;height:64px;font-size:13px">🚀 صاروخ<br><small id="mslN">٣</small></button><button class="btn r big" id="fire">🔥 نار</button><button class="btn big" id="boost">🚀 دفع</button></div>
<div id="build"></div>
<div id="menu"><div id="panel"></div></div>
<div id="title"><h1>🌌 الكون اللانهائي</h1><p>مجرّات ونجوم وكواكب بتتولّد بلا نهاية. سافر بين النجوم، اهبط على الكواكب، ابني مستعمرات، اتاجر وحارب القراصنة.</p><button class="btn g" id="startBtn" style="font-size:20px;padding:14px 34px">ابدأ الرحلة</button><button class="btn d" id="resetBtn" style="display:none">بداية جديدة</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="game.js?v=r110"></script>

</body>
</html>
