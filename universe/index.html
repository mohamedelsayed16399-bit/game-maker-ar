function makeShip(col,acc){const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color:col,metalness:.6,roughness:.35});

for(let i=drFx.length-1;i>=0;i--){drFx[i][1]-=dt;if(drFx[i][1]<=0){space.remove(drFx[i][0]);drFx.splice(i,1)}}}

race={gates,i:0,t:0};gates.forEach((g,i)=>{const nx=gates[i+1]?gates[i+1].position:g.position.clone().add(new THREE.Vector3(1,0,0));g.lookAt(nx)});if(!raceBar){raceBar=document.createElement('div');raceBar.style.cssText='position:fixed;top:118px;left:56%;transform:translateX(-50%);max-width:230px;text-align:center;z-index:7;background:#000a;border:1px solid #4cc3ff;border-radius:10px;padding:4px 10px;font-size:13px;color:#aee4ff;direction:rtl';document.body.appendChild(raceBar)}raceBar.style.display='block';toast('🏁 سباق الحلقات! ٧ حلقات في ٨٠ ثانية')};
function raceEnd(ok){race.gates.forEach(g=>space.remove(g));raceBar.style.display='none';if(ok){const r=1500+Math.max(0,Math.round(80-race.t))*20;S.credits+=r;addRep(5);S.stats.races=(S.stats.races||0)+1;toast('🏁✅ خلّصت السباق بـ'+AR(Math.round(race.t))+' ث! +'+AR(r)+' 💰')}else toast('🏁 الوقت خلص');race=null;save();hud()}
function raceUpdate(dt,tm){if(!race||mode!=='space')return;race.t+=dt;race.gates.forEach((g,i)=>{g.visible=i>=race.i;g.material.color.setHex(i===race.i?0xffe066:0x4cc3ff);g.rotation.z+=dt*.5});const g=race.gates[race.i];if(g&&g.position.distanceTo(ship.position)<38){race.i++;beep(900+race.i*80,.12,'triangle',.07);if(race.i>=race.gates.length){raceEnd(true);return}}
if(race.t>80){raceEnd(false);return}if(raceBar)raceBar.textContent='🏁 حلقة '+AR(race.i+1)+'/٧ · '+AR(Math.max(0,Math.ceil(80-race.t)))+' ث'}
function hydraCheck(){for(const p of pirates){if(p.boss&&!p.core&&!p.mother&&p.hydra===undefined){p.hydra=Math.random()<.45;if(p.hydra){p.m.traverse(o=>{if(o.material&&o.material.color){o.material=o.material.clone();o.material.color.setHex(0x1f9a4a);if(o.material.emissive)o.material.emissive.setHex(0x0a4a1a)}});toast('🐍 زعيم هيدرا! لما يموت بينقسم لتلاتة')}}}}
const _kp1=killPirate;killPirate=function(p){const hy=p.hydra&&!p.child;const pos=p.m.position.clone();_kp1(p);if(hy){for(let i=0;i<3;i++){const m=makeShip(0x1f9a4a,0x66ff99);m.scale.setScalar(1.5);m.position.copy(pos).add(new THREE.Vector3((i-1)*50,(Math.random()-.5)*30,(Math.random()-.5)*60));space.add(m);pirates.push({m,boss:false,child:true,kind:null,hp:55,cd:1+Math.random()})}toast('🐍 الهيدرا اتقسمت لتلات رؤوس!')}};
